<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" preserveAspectRatio="none" width="1200" height="8" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="25%"  stop-color="#2DD4BF"/>
      <stop offset="50%"  stop-color="#7C3AED"/>
      <stop offset="75%"  stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#0D1117"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="8" rx="4" fill="url(#g)"/>
</svg>
